<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<title>SNAKE</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="wrap">

    <div id="topbar">
      <!-- 상태 배지: 점 색깔과 문구가 항상 함께 바뀐다 (색만으로 구분하지 않는다) -->
      <div id="stateBadge" class="state-title" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="stateText">대기 중</span>
      </div>
      <div class="slot" id="hiScore">HI-SCORE <b>0</b></div>
      <div class="slot" id="silverSlot">🐭 Mice <b>0</b></div>
      <div class="slot" id="toWin">승리까지 <b>395</b></div>
      <button id="muteBtn" type="button" title="배경음악 음량: Mute · 1 · 2 · 3 (M)">🔊 BGM 2</button>
    </div>

    <div id="stage">
      <canvas id="game" width="1024" height="576"></canvas>

      <div id="overlay">
        <div id="titleBtns">
          <button id="startBtn" class="btn">시작!</button>
          <button id="shopBtn" class="btn ghost">상점</button>
        </div>
        <button id="retryBtn" class="btn hidden">한번더?</button>
        <button id="homeBtn"  class="btn hidden">메인으로</button>
      </div>

      <div id="shop" class="hidden">
        <div id="shopHead">
          <h2>스킨 상점</h2>
          <div id="shopSilver">🐭 Mice <b>0</b></div>
          <button id="shopClose" type="button" title="닫기 (ESC)">✕</button>
        </div>
        <div id="skinList"></div>
        <p id="shopNote">쥐를 한 마리 먹을 때마다 <b>Mice 1</b>이 쌓입니다. 이기든 지든 그 판에서 먹은 만큼 지급됩니다.</p>
      </div>
    </div>

    <!-- 터치 조작부: 손가락으로 눌러도 빗나가지 않도록 한 변 64px 이상을 유지한다 -->
    <div id="pad" aria-label="게임 조작">
      <button class="padBtn up"    type="button" data-dir="up"    aria-label="위로">▲</button>
      <button class="padBtn left"  type="button" data-dir="left"  aria-label="왼쪽으로">◀</button>
      <button class="padBtn mid"   type="button" data-act="pause" aria-label="일시정지 / 계속">❚❚</button>
      <button class="padBtn right" type="button" data-dir="right" aria-label="오른쪽으로">▶</button>
      <button class="padBtn down"  type="button" data-dir="down"  aria-label="아래로">▼</button>
    </div>

    <div id="footer"><span id="hint">🔊 화면을 한 번 클릭하면 배경음악이 재생됩니다</span></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
