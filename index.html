<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNAKE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">

    <div id="topbar">
      <div class="slot" id="hiScore">HI-SCORE <b>0</b></div>
      <div class="slot" id="toWin">승리까지 <b>350</b></div>
      <button id="muteBtn" type="button" title="배경음악 켜기/끄기 (M)">
        <span id="muteIcon">🔊</span> BGM
      </button>
    </div>

    <div id="stage">
      <canvas id="game" width="1024" height="576"></canvas>
      <div id="overlay">
        <button id="startBtn" class="btn">시작!</button>
        <button id="retryBtn" class="btn hidden">한번더?</button>
        <button id="homeBtn"  class="btn hidden">메인으로</button>
      </div>
    </div>

    <div id="footer"><span id="hint">🔊 화면을 한 번 클릭하면 배경음악이 재생됩니다</span></div>

  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
